confirm-close-surface = false

macos-titlebar-style = tabs

cursor-style = block_hollow

background-opacity = 0.95
background-blur = 50

window-width = 120
window-height = 90

window-padding-x = 8
window-padding-y = 8

link-url = true

auto-update = off

# This would be ideal but quick-terminal-size doesn't work at all in 1.2.0
# quick-terminal-position = top
# quick-terminal-size = 500px,800px # height,width

quick-terminal-position = center
quick-terminal-size = 800px

keybind = global:ctrl+space=toggle_quick_terminal

# https://ghostty.org/docs/help/terminfo#ssh
# configure SSH to fall back to xterm-256color.
shell-integration-features = ssh-env